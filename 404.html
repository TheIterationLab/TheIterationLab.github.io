<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Iteration Lab · Educational Research &amp; Publication Platform</title>
  <meta name="description" content="Academic research portfolio, software builds, credentials, and publications on The Iteration Lab open educational research network.">
  <link rel="icon" type="image/png" href="/public/assets/aistudio/iteration-lab-icon-jetspiral_10af4d29.png">
  <script>
    (function () {
      try {
        var loc = window.location;
        var path = loc.pathname || '';
        // Route dynamic /profile/<TYPE>/<slug> and /profile/<slug> clean URLs on GitHub Pages
        var match = path.match(/^(\/[A-Za-z0-9._-]+)?\/(profiles?)(?:\/(.*))?$/i);
        if (match) {
          var base = match[1] || '';
          var folder = (match[2] || '').toLowerCase();
          var rest = (match[3] || '').replace(/\/+$/, '');
          var isBareCanonical = folder === 'profile' && (rest === '' || /^index\.html$/i.test(rest));
          if (!isBareCanonical) {
            document.documentElement.setAttribute('data-routing', '1');
            var existingParams = new URLSearchParams(loc.search || '');
            existingParams.set('__r', path);
            var targetUrl = base + '/profile/?' + existingParams.toString() + (loc.hash || '');
            try {
              sessionStorage.setItem('til_gh_profile_route', path + (loc.search || '') + (loc.hash || ''));
            } catch (_) {}
            loc.replace(targetUrl);
            return;
          }
        }
      } catch (_) {}
    })();
  </script>
  <style>
    html[data-routing="1"] body {
      display: none !important;
    }
    .notfound-shell {
      min-height: calc(100vh - 80px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 64px 20px;
    }
    .notfound-card {
      max-width: 560px;
      width: 100%;
      background: #ffffff;
      border: 1px solid rgba(15, 23, 42, 0.1);
      border-radius: 16px;
      padding: 44px 36px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.05);
      text-align: left;
    }
    .notfound-kicker {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #0d9488;
      margin-bottom: 12px;
      display: block;
    }
    .notfound-title {
      font-family: 'Newsreader', Georgia, serif;
      font-size: clamp(28px, 4vw, 38px);
      font-weight: 600;
      line-height: 1.18;
      color: #0f172a;
      margin: 0 0 14px;
    }
    .notfound-desc {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-size: 15.5px;
      line-height: 1.65;
      color: #475569;
      margin: 0 0 28px;
    }
    .notfound-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header" role="banner">
    <div class="container header-inner">
      <a href="/" class="brand-wrapper" aria-label="The Iteration Lab Home">
        <div class="brand-icon-tile">
          <img src="/public/assets/aistudio/iteration-lab-icon-jetspiral_10af4d29.png" alt="Iteration Lab Spiral Emblem" width="34" height="34">
        </div>
        <span class="brand-name">The Iteration Lab</span>
      </a>
      <div class="header-actions">
        <a href="/" class="btn btn-outline">Back to Home</a>
      </div>
    </div>
  </header>

  <main class="notfound-shell" id="main-content">
    <section class="notfound-card" aria-labelledby="notfound-heading">
      <span class="notfound-kicker">ERROR 404 · PAGE NOT FOUND</span>
      <h1 class="notfound-title" id="notfound-heading">This page could not be found on The Iteration Lab.</h1>
      <p class="notfound-desc">
        The link may have moved, or the address may contain a typo. Return to the main platform or browse open research and member directories below.
      </p>
      <div class="notfound-actions">
        <a href="/" class="btn btn-primary">Go to Home</a>
        <a href="/researches/" class="btn btn-outline">Explore Research</a>
        <a href="/leaders/" class="btn btn-outline">Platform Leaders</a>
      </div>
    </section>
  </main>
</body>
</html>
